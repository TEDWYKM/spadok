<style>
:root{
  --ink:#15242E;
  --ink-2:#3A5060;
  --ink-3:#6D8091;
  --sheet:#F2F1E9;
  --stone:#DFDFD3;
  --verd:#2E7D6C;
  --verd-dk:#1C5849;
  --copper:#A8542B;
  --gold:#B08417;
  --line:rgba(21,36,46,.14);
  --line-2:rgba(21,36,46,.28);
  --shadow:0 1px 0 rgba(21,36,46,.08), 0 12px 32px -18px rgba(21,36,46,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:transparent;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3{font-family:"Unbounded","Unbounded Fallback",system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}

/* ---------- каркас ---------- */
.frame{max-width:430px;margin:0 auto;background:var(--sheet);
  border:1px solid var(--line-2);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-height:760px;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:var(--sheet);position:sticky;top:0;z-index:20}
.bar h1{font-size:15px;letter-spacing:.01em}
.bar .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase}
.back{width:30px;height:30px;border:1px solid var(--line-2);border-radius:8px;display:grid;place-items:center;flex:none}
.body{flex:1;overflow:auto;padding:16px 16px 96px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);background:var(--sheet);z-index:20}
.nav button{padding:11px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.nav button[aria-current="true"]{color:var(--verd-dk)}
.nav button[aria-current="true"] svg{stroke:var(--verd-dk)}
.nav svg{stroke:var(--ink-3);fill:none;stroke-width:1.5}

/* ---------- типографіка ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:"IBM Plex Mono",monospace}
.lede{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.rule{height:1px;background:var(--line);margin:18px 0}

/* ---------- карта ---------- */
.map{position:relative;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--stone)}
.map svg{display:block;width:100%;height:auto}
.mapnote{position:absolute;left:8px;bottom:6px;font-family:"IBM Plex Mono",monospace;
  font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.pt{cursor:pointer}
.pt .hit{fill:transparent}

/* ---------- фільтри ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;
  font-size:12px;background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- картки ---------- */
.card{border:1px solid var(--line-2);border-radius:14px;background:#FAF9F3;padding:14px;margin-bottom:10px}
.card h3{font-size:14.5px;line-height:1.3}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-2)}
.tag.ok{color:var(--verd-dk);border-color:rgba(46,125,108,.45);background:rgba(46,125,108,.08)}
.tag.warn{color:var(--copper);border-color:rgba(168,84,43,.4);background:rgba(168,84,43,.08)}
.tag.stop{color:#8E2F2F;border-color:rgba(142,47,47,.4);background:rgba(142,47,47,.08)}

/* ---------- кнопки ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--ink);color:var(--sheet);
  font-family:"Unbounded",sans-serif;font-size:13px;font-weight:600;letter-spacing:-.01em;text-align:center}
.btn.go{background:var(--verd-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn:disabled{opacity:.4}
.btn-sm{padding:9px 14px;border:1px solid var(--line-2);border-radius:9px;font-size:12px}

/* ---------- зірки ---------- */
.stars{display:flex;gap:5px}
.star{width:30px;height:30px;display:grid;place-items:center}
.star svg{width:25px;height:25px}
.star svg path{fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-linejoin:round}
.star.on svg path{fill:var(--gold);stroke:var(--gold)}
.stars.sm .star{width:15px;height:15px}
.stars.sm .star svg{width:13px;height:13px}

/* ---------- штамп відвідин ---------- */
.stamp{border:1.5px solid var(--verd-dk);color:var(--verd-dk);border-radius:8px;padding:6px 9px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  transform:rotate(-2.5deg);display:inline-block;opacity:.85}

/* ---------- медіа-блок пам'ятки ---------- */
.plate{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--stone)}
.plate svg{display:block;width:100%;height:auto}
.switch{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-2)}
.switch button{padding:9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);background:#EDEBE1}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* ---------- інше ---------- */
.locked{border:1px dashed var(--line-2);border-radius:12px;padding:13px;display:flex;gap:11px;align-items:center;
  background:rgba(21,36,46,.03)}
.alert{border:1px solid rgba(168,84,43,.4);background:rgba(168,84,43,.07);border-radius:11px;
  padding:11px 13px;font-size:12px;line-height:1.5;color:#7C3E1F;margin-bottom:12px}
.field{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px;font:inherit;font-size:13px;
  background:#FAF9F3;resize:vertical;color:var(--ink)}
.field:focus{outline:2px solid var(--verd);outline-offset:1px}
.badge{border:1px solid var(--line-2);border-radius:12px;padding:12px;text-align:center;background:#FAF9F3}
.badge.got{border-color:var(--gold);background:rgba(176,132,23,.09)}
.badge .g{font-size:22px;line-height:1;margin-bottom:6px;filter:grayscale(1);opacity:.35}
.badge.got .g{filter:none;opacity:1}
.badge .n{font-size:10.5px;line-height:1.3;font-weight:600}
.badge .d{font-size:9.5px;color:var(--ink-3);margin-top:3px;line-height:1.3}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{border:1px solid var(--line-2);border-radius:11px;padding:11px;text-align:center;background:#FAF9F3}
.stat b{font-family:"Unbounded",sans-serif;font-size:19px;display:block;line-height:1.1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stops{list-style:none;padding:0;margin:0}
.stops li{display:flex;gap:11px;padding:9px 0}
.dotcol{display:flex;flex-direction:column;align-items:center;flex:none;width:16px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:var(--sheet);flex:none;margin-top:4px}
.dot.done{background:var(--verd-dk);border-color:var(--verd-dk)}
.dot.now{background:var(--copper);border-color:var(--copper);box-shadow:0 0 0 4px rgba(168,84,43,.18)}
.stem{width:1.5px;flex:1;background:var(--line-2);margin:3px 0}
:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .28s ease both}
  @keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>

  {id:'rock',    g:'\u25C7', n:'Камінь і дерево', d:'Дійти до Тустані'}
];

/* ═══════════ СТАН ═══════════ */
const KEY='spadok:lviv:v1';
let S = {visited:{}, ratings:{}, done:[], badges:[]};
let V = {screen:'map', theme:'all', sort:'pop', route:null, idx:0, t0:0, sel:null, media:'photo', draftStars:0};

async function load(){ try{const r=await window.storage.get(KEY); if(r&&r.value) S=Object.assign(S,JSON.parse(r.value));}catch(e){} }
async function save(){ try{ await window.storage.set(KEY, JSON.stringify(S)); }catch(e){} }

/* ═══════════ УТИЛІТИ ═══════════ */
const P = id => POINTS.find(p=>p.id===id);
function dist(a,b){const R=6371,r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function routeStats(r){
  const chain=[P(r.from),...r.stops.map(P)];
  let km=0; for(let i=1;i<chain.length;i++) km+=dist(chain[i-1],chain[i]);
  const min=Math.round(km/52*60)+r.stops.length*45;
  const near=r.stops.reduce((a,id)=>{const p=P(id);a.shop+=p.near.shop;a.stay+=p.near.stay;a.food+=p.near.food;return a},{shop:0,stay:0,food:0});
  return {km:Math.round(km), min, near, worst:r.stops.some(id=>P(id).st==='warn')?'warn':'ok'};
}
const hhmm = m => (m>=60? Math.floor(m/60)+' год ' : '') + (m%60) + ' хв';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stamp(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' \u00B7 '+p(d.getHours())+':'+p(d.getMinutes());}

/* проєкція для схематичної карти */
const BOX={lon0:23.30,lon1:25.12,lat0:49.08,lat1:50.18,w:600,h:560};
const X = lon => (lon-BOX.lon0)/(BOX.lon1-BOX.lon0)*BOX.w;
const Y = lat => (BOX.lat1-lat)/(BOX.lat1-BOX.lat0)*BOX.h;

function glyph(p,r){
  const x=X(p.lon).toFixed(1), y=Y(p.lat).toFixed(1);
  if(p.kind==='castle'||p.kind==='city')
    return `<path d="M${x} ${y-r} L${x-r*.42} ${y-r*.42} L${+x-r} ${y} L${x-r*.42} ${+y+r*.42} L${x} ${+y+r} L${+x+r*.42} ${+y+r*.42} L${+x+r} ${y} L${+x+r*.42} ${y-r*.42} Z"`;
  if(p.kind==='sacral') return `<circle cx="${x}" cy="${y}" r="${r*.72}"`;
  return `<path d="M${x} ${y-r} L${+x+r*.86} ${+y+r*.6} L${x-r*.86} ${+y+r*.6} Z"`;
}

/* ═══════════ КАРТА ═══════════ */
function mapSVG(list, opts){
  opts=opts||{};
  const grid=[];
  for(let i=1;i<8;i++) grid.push(`<line x1="${i*75}" y1="0" x2="${i*75}" y2="560"/>`);
  for(let i=1;i<8;i++) grid.push(`<line x1="0" y1="${i*70}" x2="600" y2="${i*70}"/>`);

  const pins = list.map(p=>{
    const on = !!S.visited[p.id];
    const now = opts.now===p.id;
    const fill = now? 'var(--copper)' : on? 'var(--verd-dk)' : 'var(--sheet)';
    const g = glyph(p, now?11:9);
    return `<g class="pt" onclick="openPoint('${p.id}')">
      ${g} fill="${fill}" stroke="var(--ink)" stroke-width="1.6"/>
      ${now?`<circle cx="${X(p.lon)}" cy="${Y(p.lat)}" r="20" fill="none" stroke="var(--copper)" stroke-width="1.2" opacity=".55"/>`:''}
      <circle class="hit" cx="${X(p.lon)}" cy="${Y(p.lat)}" r="22"/>
      <text x="${X(p.lon)+14}" y="${Y(p.lat)+4}" font-family="IBM Plex Mono,monospace" font-size="10.5"
        fill="var(--ink)" opacity=".85">${esc(p.n.split(',')[0])}</text>
    </g>`;
  }).join('');

  let track='';
  if(opts.track && opts.track.length>1){
    const d=opts.track.map((id,i)=>(i?'L':'M')+X(P(id).lon).toFixed(1)+' '+Y(P(id).lat).toFixed(1)).join(' ');
    track=`<path d="${d}" fill="none" stroke="var(--copper)" stroke-width="2.4"
      stroke-dasharray="7 5" stroke-linecap="round" opacity=".9"/>`;
  }

  return `<div class="map"><svg viewBox="0 0 600 560" role="img" aria-label="Схематична карта Львівщини">
    <rect width="600" height="560" fill="var(--stone)"/>
    <g stroke="var(--line)" stroke-width="1">${grid.join('')}</g>
    <path d="M120 470 C200 430 260 440 330 400 C400 360 470 370 540 330" fill="none"
      stroke="rgba(46,125,108,.5)" stroke-width="2.2"/>
    <path d="M215 60 C230 130 200 200 240 260" fill="none" stroke="rgba(46,125,108,.5)" stroke-width="2"/>
    <text x="128" y="486" font-family="IBM Plex Mono,monospace" font-size="9"
      fill="var(--verd-dk)" opacity=".8">ДНІСТЕР</text>
    ${track}${pins}
  </svg><span class="mapnote">схематична карта \u00B7 Львівська обл.</span></div>`;
}

/* ═══════════ ЕКРАНИ ═══════════ */
function stars(v, cls){
  let h=`<div class="stars ${cls||''}">`;
  for(let i=1;i<=5;i++) h+=`<span class="star ${i<=v?'on':''}"><svg viewBox="0 0 24 24">
    <path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5 6.2 20.6l1.1-6.5L2.6 9.5l6.5-.9z"/></svg></span>`;
  return h+'</div>';
}
function starPicker(pid, cur){
  let h='<div class="stars" role="radiogroup" aria-label="Ваша оцінка">';
  for(let i=1;i<=5;i++) h+=`<button class="star ${i<=cur?'on':''}" role="radio" aria-checked="${i===cur}"
    aria-label="${i} з 5" onclick="pickStars('${pid}',${i})"><svg viewBox="0 0 24 24">
    <path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5 6.2 20.6l1.1-6.5L2.6 9.5l6.5-.9z"/></svg></button>`;
  return h+'</div>';
}
const stTag = st => st==='ok' ? '<span class="tag ok">доступно</span>'
  : st==='warn' ? '<span class="tag warn">обмежено</span>' : '<span class="tag stop">закрито</span>';

/* — екран: карта і теми — */
function scrMap(){
  const list = V.theme==='all' ? POINTS : POINTS.filter(p=>p.t.includes(V.theme));
  const sorted = [...list].sort((a,b)=> V.sort==='pop' ? b.pop-a.pop : dist(P('rynok'),a)-dist(P('rynok'),b));
  const vis = Object.keys(S.visited).length;

  return `<div class="fade">
    <div class="alert"><b>Повітряна тривога у Львівській обл.: немає.</b><br>
      Дані оновлено 17.08.2026, 09:14. У робочій версії — автоматично через офіційне API тривог.</div>

    <div class="chips" role="group" aria-label="Тема">
      <button class="chip" aria-pressed="${V.theme==='all'}" onclick="setTheme('all')">Усі теми</button>
      ${Object.entries(THEMES).map(([k,v])=>
        `<button class="chip" aria-pressed="${V.theme===k}" onclick="setTheme('${k}')">${v}</button>`).join('')}
    </div>

    ${mapSVG(list)}

    <div class="between" style="margin:16px 0 10px">
      <span class="eyebrow">${list.length} точок \u00B7 ${vis} відвідано</span>
      <button class="btn-sm" onclick="toggleSort()">${V.sort==='pop'?'Найпопулярніші':'Найближчі'} \u21C5</button>
    </div>

    ${sorted.map(p=>{
      const d=Math.round(dist(P('rynok'),p));
      const my=S.ratings[p.id];
      return `<div class="card" onclick="openPoint('${p.id}')">
        <div class="between"><h3>${esc(p.n)}</h3>${stTag(p.st)}</div>
        <p class="lede" style="margin:7px 0 9px">${esc(p.s)}</p>
        <div class="between">
          <div class="row">${stars(Math.round(my||p.rate),'sm')}
            <span class="meta">${(my||p.rate).toFixed(1)}${my?' \u00B7 ваша':''}</span></div>
          <span class="meta">${d} км від Львова</span>
        </div>
        ${S.visited[p.id]?`<div style="margin-top:10px"><span class="stamp">Відвідано \u00B7 ${stamp(S.visited[p.id])}</span></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

/* — екран: маршрути — */
function scrRoutes(){
  const themed = V.theme==='all' ? ROUTES
    : ROUTES.filter(r=>r.stops.some(id=>P(id).t.includes(V.theme)));
  return `<div class="fade">
    <p class="lede" style="margin:0 0 14px">Маршрути будуються від Львова. Оберіть готовий або
      відфільтруйте за темою на вкладці «Карта».</p>
    ${themed.map(r=>{
      const s=routeStats(r), fin=S.done.includes(r.id);
      return `<div class="card" onclick="openRoute('${r.id}')">
        <div class="between"><h3>${esc(r.n)}</h3>
          ${fin?'<span class="tag ok">пройдено</span>':s.worst==='warn'?'<span class="tag warn">є обмеження</span>':''}</div>
        <p class="lede" style="margin:7px 0 10px">${esc(r.why)}</p>
        <div class="row" style="gap:14px">
          <span class="meta">${r.stops.length} точки</span>

      </div>`;
    }).join('') || '<p class="lede">За цією темою маршрутів поки немає. Спробуйте іншу.</p>'}
  </div>`;
}

/* — екран: деталі маршруту — */
function scrRoute(){
  const r=ROUTES.find(x=>x.id===V.route), s=routeStats(r);
  return `<div class="fade">
    ${mapSVG(r.stops.map(P), {track:[r.from,...r.stops]})}
    <div class="grid3" style="margin:14px 0">
      <div class="stat"><b>${s.km}</b><span>кілометрів</span></div>
      <div class="stat"><b>${Math.floor(s.min/60)}:${String(s.min%60).padStart(2,'0')}</b><span>у дорозі</span></div>

        <div class="dotcol"><span class="dot ${S.visited[id]?'done':''}"></span>${i<r.stops.length-1?'<span class="stem"></span>':''}</div>
        <div style="flex:1">

    </ul>

    <div class="rule"></div>
    <button class="btn ghost" style="margin-bottom:10px" onclick="offline(this)">Завантажити для офлайну</button>
    <button class="btn go" onclick="startJourney()">В подорож</button>
    <p class="meta" style="text-align:center;margin:10px 0 0">Дані про точки оновлено 12.08.2026</p>
  </div>`;
}

/* — екран: подорож — */
function scrJourney(){
  const r=ROUTES.find(x=>x.id===V.route), cur=P(r.stops[V.idx]);
  const prev = V.idx===0 ? P(r.from) : P(r.stops[V.idx-1]);
  const km = Math.round(dist(prev,cur));
  return `<div class="fade">
    ${mapSVG(r.stops.map(P), {track:[r.from,...r.stops], now:cur.id})}
    <div class="card" style="margin-top:14px">
      <span class="eyebrow">Наступна зупинка \u00B7 ${V.idx+1} з ${r.stops.length}</span>
      <h2 style="font-size:19px;margin:8px 0 6px">${esc(cur.n)}</h2>
      <div class="row" style="gap:14px">
        <span class="meta">${km} км</span>
        <span class="meta">~${Math.round(km/52*60)} хв</span>
        ${stTag(cur.st)}
      </div>
    </div>
    <p class="lede" style="font-size:12.5px">У робочій версії картка пам\u2019ятки відкриється автоматично,
      щойно ви в\u2019їдете в радіус точки. Тут — вручну.</p>
    <button class="btn go" onclick="arrive()">Я на місці</button>
    <button class="btn ghost" style="margin-top:8px" onclick="go('routes')">Перервати подорож</button>
  </div>`;
}

/* — екран: картка пам'ятки — */
function scrPoint(){

      <button class="btn-sm" style="margin-top:9px;width:100%" onclick="saveReview('${p.id}')"

      <p class="meta" style="margin:9px 0 0">Оцінку можна залишити лише з місця — це захищає рейтинг від накрутки.</p>

/* — екран: фініш — */
function scrFinish(){
  const r=ROUTES.find(x=>x.id===V.route);
  const mins=Math.max(1,Math.round((Date.now()-V.t0)/60000));
  const s=routeStats(r);
  const fresh=V.fresh||[];
  return `<div class="fade" style="text-align:center">

/* ═══════════ ІЛЮСТРАЦІЇ-ЗАГЛУШКИ ═══════════ */
function photoSVG(p){
  return `<svg viewBox="0 0 400 230"><rect width="400" height="230" fill="#CFCEC2"/>
    <path d="M0 175 L60 150 L120 168 L190 128 L260 158 L330 138 L400 162 L400 230 L0 230 Z" fill="#B8B7A9"/>
    <rect x="150" y="88" width="100" height="80" fill="#A3A295"/>
    <rect x="138" y="70" width="24" height="98" fill="#96958A"/>
    <rect x="238" y="70" width="24" height="98" fill="#96958A"/>
    <rect x="192" y="122" width="16" height="46" fill="#7E7D74"/>
    <circle cx="322" cy="52" r="18" fill="#DEDDD1" opacity=".8"/>
    <text x="200" y="212" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10"
      fill="#5C5B52" letter-spacing="1.5">ФОТО ПАМ'ЯТКИ \u00B7 ${esc(p.n.split(',')[0].toUpperCase())}</text></svg>`;
}
function reconSVG(p){
  return `<svg viewBox="0 0 400 230"><rect width="400" height="230" fill="#DDE3E0"/>

/* ═══════════ ДІЇ ═══════════ */
function setTheme(t){V.theme=t;render()}
function toggleSort(){V.sort=V.sort==='pop'?'near':'pop';render()}
function openRoute(id){V.route=id;V.screen='route';render()}
function openPoint(id){V.sel=id;V.media='photo';V.draftStars=0;V.screen='point';render()}
function setMedia(m){V.media=m;render()}
function expand(id){document.getElementById('desc').textContent=P(id).f;document.getElementById('more').remove()}
function offline(b){b.textContent='Завантажено \u00B7 42 МБ';b.disabled=true}
function report(){alert('Форма звіту: що не так із точкою?\n\n\u2022 закрито / змінився графік\n\u2022 небезпечно, пошкоджено\n\u2022 помилка в описі\n\nУ робочій версії — черга модерації.')}

function go(s){V.screen=s;window.scrollTo(0,0);render()}
function startJourney(){V.idx=0;V.t0=Date.now();V.screen='journey';render()}
function arrive(){
  const r=ROUTES.find(x=>x.id===V.route), id=r.stops[V.idx];
  if(!S.visited[id]) S.visited[id]=Date.now();
  save(); checkBadges(); openPoint(id);
}
function continueJourney(){
  const r=ROUTES.find(x=>x.id===V.route);
  if(V.idx < r.stops.length-1){ V.idx++; V.screen='journey'; }
  else { if(!S.done.includes(r.id)) S.done.push(r.id);
    V.fresh=checkBadges(); save(); V.screen='finish'; }
  window.scrollTo(0,0); render();
}
function pickStars(id,n){V.draftStars=n;render()}
function saveReview(id){
  const n=V.draftStars||S.ratings[id]; if(!n) return;
  S.ratings[id]=n;
  const t=document.getElementById('rev');
  if(t && t.value.trim()) S.ratings[id+':txt']=t.value.trim(); else delete S.ratings[id+':txt'];
  V.draftStars=0; save(); V.fresh=checkBadges(); render();
}
function reset(){ if(confirm('Очистити всі штампи, оцінки й нагороди?')){
  S={visited:{},ratings:{},done:[],badges:[]}; save(); render(); } }

function checkBadges(){
  const v=Object.keys(S.visited), fresh=[];
  const add=id=>{ if(!S.badges.includes(id)){S.badges.push(id);fresh.push(id);} };
  if(v.length>=1) add('first');
  if(v.length>=5) add('five');
  if(['olesko','pidhirtsi','zolochiv'].every(x=>v.includes(x))) add('horseshoe');
  if(v.filter(x=>P(x).t.includes('ruin')).length>=3) add('ruin');
  if(Object.keys(S.ratings).filter(k=>!k.includes(':')).length>=5) add('critic');
  if(['krekhiv','univ'].every(x=>v.includes(x))) add('sacral');
  if(S.done.length>=1) add('route1');
  if(v.includes('tustan')) add('rock');
  save(); return fresh;
}

/* ═══════════ РЕНДЕР ═══════════ */
const TITLES={map:['Спадок','Львівщина \u00B7 MVP'],routes:['Маршрути','від Львова'],
  route:['Маршрут',''],journey:['У дорозі',''],point:['Пам\u2019ятка',''],
  finish:['Подорож завершено',''],profile:['Мандрівний лист','']};

function render(){
  const [t,sub]=TITLES[V.screen];
  const backTo = {route:'routes', journey:'route', point:(V.route&&V.screen==='point')?'journey':'map', finish:null};
  const b=backTo[V.screen];
  document.getElementById('bar').innerHTML =
    (b?`<button class="back" onclick="go('${b}')" aria-label="Назад">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/></svg></button>`:'')+
    `<div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>`;

  document.getElementById('body').innerHTML =
    V.screen==='map'?scrMap(): V.screen==='routes'?scrRoutes(): V.screen==='route'?scrRoute():
    V.screen==='journey'?scrJourney(): V.screen==='point'?scrPoint():
    V.screen==='finish'?scrFinish(): scrProfile();

  const items=[['map','Карта','M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z'],
    ['routes','Маршрути','M4 19h6a4 4 0 000-8H9a4 4 0 010-8h11'],
    ['journey','Подорож','M12 21s7-6.4 7-11a7 7 0 10-14 0c0 4.6 7 11 7 11z'],
    ['profile','Лист','M6 3h9l4 4v14H6z M9 12h7 M9 16h5']];
  document.getElementById('nav').innerHTML = items.map(([k,l,d])=>{
    const dis = k==='journey' && !V.route;
    return `<button aria-current="${V.screen===k}" ${dis?'disabled style="opacity:.35"':''}
      onclick="${dis?'':`go('${k}')`}">
      <svg width="17" height="17" viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`}).join('');
}

load().then(render);
</script>
